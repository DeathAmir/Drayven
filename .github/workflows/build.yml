name: Build Drayven Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android arm64 signed APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor open licensed assets into repository
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets/vendor/{characters,enemies,items,ui,backgrounds,fonts,music,sfx} licenses
          curl -fL --retry 4 -o assets/vendor/characters/topdown_man.png "https://opengameart.org/sites/default/files/sprite-sheet_0.png"
          curl -fL --retry 4 -o assets/vendor/items/chest.png "https://opengameart.org/sites/default/files/Chest_0.png"
          curl -fL --retry 4 -o assets/vendor/items/chest_open.png "https://opengameart.org/sites/default/files/Chest_open_0.png"
          curl -fL --retry 4 -o assets/vendor/music/psycho_punch.ogg "https://opengameart.org/sites/default/files/Psycho%20Punch_1.ogg"
          curl -fL --retry 4 -o assets/vendor/sfx/laser.wav "https://opengameart.org/sites/default/files/laserthing.wav"
          curl -fL --retry 4 -o assets/vendor/sfx/click.wav "https://opengameart.org/sites/default/files/click_0.wav"
          KBASE="https://raw.githubusercontent.com/iwenzhou/kenney/master/Art%20(5190%20files)"
          curl -fL --retry 4 -o assets/vendor/backgrounds/darkPurple.png "$KBASE/Space%20shooter%20assets%20(300%20assets)/Backgrounds/darkPurple.png"
          curl -fL --retry 4 -o assets/vendor/splash.png "$KBASE/Space%20shooter%20assets%20(300%20assets)/sample.png"
          curl -fL --retry 4 -o assets/vendor/app_icon.png "$KBASE/Space%20shooter%20assets%20(300%20assets)/PNG/playerShip1_blue.png"
          for spec in "enemyBlack1.png" "enemyBlue2.png" "enemyRed3.png" "enemyGreen4.png" "enemyRed5.png"; do curl -fL --retry 4 -o "assets/vendor/enemies/$spec" "$KBASE/Space%20shooter%20assets%20(300%20assets)/PNG/Enemies/$spec"; done
          IBASE="$KBASE/Platformer%20assets%20(1330%20assets)/Base%20pack%20(360%20assets)/Items"
          curl -fL --retry 4 -o assets/vendor/items/flagBlue.png "$IBASE/flagBlue.png"
          curl -fL --retry 4 -o assets/vendor/items/fireball.png "$IBASE/fireball.png"
          curl -fL --retry 4 -o assets/vendor/ui/buttonBlue.png "$IBASE/buttonBlue.png"
          curl -fL --retry 4 -o assets/vendor/ui/buttonBlue_pressed.png "$IBASE/buttonBlue_pressed.png"
          UBASE="$KBASE/Onscreen%20controls%20(400%20assets)/Sprites/flatDark"
          for n in 00 06 07 08; do curl -fL --retry 4 -o "assets/vendor/ui/flatDark${n}.png" "$UBASE/flatDark${n}.png"; done
          curl -fL --retry 4 -o assets/vendor/fonts/Vazirmatn-RD-Regular.ttf "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/Round-Dots/fonts/ttf/Vazirmatn-RD-Regular.ttf"
          curl -fL --retry 4 -o licenses/OFL-1.1-Vazirmatn.txt "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt"
          curl -fL --retry 4 -o licenses/Vazirmatn-AUTHORS.txt "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/AUTHORS.txt"
          curl -fL --retry 4 -o licenses/CC0-1.0.txt "https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt"
          curl -fL --retry 4 -o licenses/GODOT-MIT.txt "https://raw.githubusercontent.com/godotengine/godot/4.6.2-stable/LICENSE.txt"
          test -s assets/vendor/characters/topdown_man.png
          test -s assets/vendor/fonts/Vazirmatn-RD-Regular.ttf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor licenses
          if ! git diff --cached --quiet; then
            git commit -m "vendor CC0/OFL game assets [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.6.2 and templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.2-stable_linux.x86_64 godot
          chmod +x godot
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          mkdir -p /tmp/drayven_templates "$HOME/.local/share/godot/export_templates/4.6.2.stable"
          unzip -q templates.tpz -d /tmp/drayven_templates
          cp -a /tmp/drayven_templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.2.stable/"
          ./godot --version

      - name: Ensure Android SDK requirements
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          ./godot --headless --path . --editor --quit || true
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/'.config/godot/editor_settings-4.6.tres'
          p.parent.mkdir(parents=True,exist_ok=True)
          text=p.read_text() if p.exists() else '[gd_resource format=3]\n\n[resource]\n'
          keys={'export/android/android_sdk_path':os.environ['ANDROID_SDK_ROOT'],'export/android/java_sdk_path':os.environ['JAVA_HOME']}
          lines=text.splitlines(); out=[]; seen=set()
          for line in lines:
              hit=False
              for k,v in keys.items():
                  if line.startswith(k+' ='):
                      out.append(f'{k} = "{v}"'); seen.add(k); hit=True; break
              if not hit: out.append(line)
          for k,v in keys.items():
              if k not in seen: out.append(f'{k} = "{v}"')
          p.write_text('\n'.join(out)+'\n')
          PY

      - name: Prepare Android signing
        shell: bash
        env:
          KS_B64: ${{ secrets.DRAYVEN_ANDROID_KEYSTORE_B64 }}
          KS_ALIAS: ${{ secrets.DRAYVEN_ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.DRAYVEN_ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_ALIAS:-}" ] && [ -n "${KS_PASS:-}" ]; then
            echo "$KS_B64" | base64 -d > /tmp/drayven-release.keystore; ALIAS="$KS_ALIAS"; PASS="$KS_PASS"
          else
            ALIAS="drayvenci"; PASS="DrayvenCI2026"
            keytool -genkeypair -v -keystore /tmp/drayven-release.keystore -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Drayven Mobile CI,O=DeathAmir,C=DE"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/drayven-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Validate and export signed APK
        shell: bash
        run: |
          set -euxo pipefail
          ./godot --headless --path . --editor --quit
          mkdir -p build/android
          ./godot --headless --path . --export-release Android build/android/Drayven.apk
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose build/android/Drayven.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Drayven-android-arm64
          path: build/android/Drayven.apk
          if-no-files-found: error

      - name: Publish stable direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          TARGET="$(git rev-parse HEAD)"
          gh release delete mobile-latest --cleanup-tag -y || true
          gh release create mobile-latest build/android/Drayven.apk --target "$TARGET" --title "Drayven Mobile Latest" --notes "Godot 4.6.2 • Android arm64 • signed APK • CC0/OFL assets"
